<svg xmlns="http://www.w3.org/2000/svg" width="720" height="40" viewBox="0 0 720 40" role="img" aria-labelledby="title desc">
  <title id="title">A small camper on the road</title>
  <desc id="desc">A camper travels along a blue line, a nod to CamperTrader.</desc>
  <style>
    .road { stroke: #d0d7de; }
    .camper { transform: translateX(658px); animation: travel 4s cubic-bezier(.2,.7,.3,1) 1; }
    @keyframes travel { from { transform: translateX(8px); } to { transform: translateX(658px); } }
    @media (prefers-color-scheme: dark) { .road { stroke: #30363d; } }
    @media (prefers-reduced-motion: reduce) { .camper { animation: none; } }
  </style>
  <path class="road" d="M8 31H712" stroke-width="1"/>
  <g class="camper" stroke="#218bff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 25V11a3 3 0 0 1 3-3h22l9 10v7Z" fill="#ddf4ff"/>
    <path d="M11 8V4h18l3 4" fill="#ddf4ff"/>
    <path d="M29 11v8h8l-7-8Z" fill="#218bff" stroke="none"/>
    <rect x="10" y="12" width="10" height="7" rx="1" fill="#218bff" stroke="none"/>
    <path d="M25 12v13M4 25h36"/>
    <circle cx="12" cy="27" r="4" fill="#ffffff"/>
    <circle cx="32" cy="27" r="4" fill="#ffffff"/>
  </g>
</svg>
